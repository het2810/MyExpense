spring.application.name=backend

# ---------------------------------------------------------------------------
# Datasource
# DB_URL/DB_USERNAME have local-dev defaults for convenience. DB_PASSWORD has
# no default and is required (constitution 13 - never commit credentials).
# ---------------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/myexpense}
spring.datasource.username=${DB_USERNAME:admin}
spring.datasource.password=${DB_PASSWORD}

# ---------------------------------------------------------------------------
# JPA / Hibernate
# ddl-auto=validate: Hibernate must never auto-generate or alter schema in
# this project. Flyway (below) is the only thing that owns schema changes,
# and Flyway itself is Database-Architect-owned (constitution 6).
# ---------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ---------------------------------------------------------------------------
# Flyway
# backend/ and database/ are sibling folders under the repo root - migrations
# live in the Database Architect-owned /database folder, not under /backend.
# ---------------------------------------------------------------------------
spring.flyway.enabled=true
spring.flyway.locations=filesystem:../database/migrations

# ---------------------------------------------------------------------------
# Jackson
# ---------------------------------------------------------------------------
# Jackson 3 (tools.jackson.*, the default in Spring Boot 4) removed
# SerializationFeature.WRITE_DATES_AS_TIMESTAMPS - dates already serialize as
# ISO-8601 strings by default, so the old opt-out property is both invalid and
# unnecessary here.
spring.jackson.time-zone=UTC

# ---------------------------------------------------------------------------
# JWT / refresh token lifetimes (docs/architecture/authentication.md)
# JWT_SECRET has no default - required env var, must be a long, random,
# base64/plain string (32+ bytes) used as the HMAC-SHA signing key. Never
# commit a real value (constitution 13).
# ---------------------------------------------------------------------------
app.security.jwt.secret=${JWT_SECRET}
app.security.jwt.access-token-ttl-seconds=900
app.security.jwt.refresh-token-ttl-days=30

# ---------------------------------------------------------------------------
# Verification tokens (password reset / email verification)
# ---------------------------------------------------------------------------
app.security.verification.password-reset-ttl-minutes=60
app.security.verification.email-verification-ttl-hours=24

# ---------------------------------------------------------------------------
# Account lockout (security-architecture.md section 5)
# ---------------------------------------------------------------------------
app.security.lockout.max-attempts=5
app.security.lockout.duration-minutes=15

# ---------------------------------------------------------------------------
# CORS - closed by default (empty = no cross-origin requests allowed). Only
# relevant to a future browser-based client; the mobile app is unaffected.
# Comma-separated list of exact origins, e.g. https://app.myexpense.example
# ---------------------------------------------------------------------------
app.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# ---------------------------------------------------------------------------
# Rate limiting - /api/v1/auth/** strict tier (security-architecture.md
# section 1/11). "ip" applies to all 8 endpoints; the rest are per-account
# (email) tiers layered on top of the endpoints that carry an email.
# ---------------------------------------------------------------------------
app.ratelimit.auth.ip.capacity=20
app.ratelimit.auth.ip.window-seconds=60
app.ratelimit.auth.login.capacity=5
app.ratelimit.auth.login.window-seconds=900
app.ratelimit.auth.register.capacity=5
app.ratelimit.auth.register.window-seconds=3600
app.ratelimit.auth.forgot-password.capacity=3
app.ratelimit.auth.forgot-password.window-seconds=900
app.ratelimit.auth.resend-verification.capacity=3
app.ratelimit.auth.resend-verification.window-seconds=900

# ---------------------------------------------------------------------------
# Logging - constitution 23: never log passwords/tokens/credentials. Keep
# this at INFO in any shared/production environment; DEBUG is for local use
# only and must not remain enabled in a deployed build.
# ---------------------------------------------------------------------------
logging.level.com.myexpense.backend=INFO
