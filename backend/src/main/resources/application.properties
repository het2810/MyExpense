spring.application.name=backend

# ---------------------------------------------------------------------------
# Datasource
# DB_URL/DB_USERNAME have local-dev defaults for convenience. DB_PASSWORD has
# no default and is required (constitution 13 - never commit credentials).
# ---------------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/myexpense}
spring.datasource.username=${DB_USERNAME:admin}
spring.datasource.password=${DB_PASSWORD}

# ---------------------------------------------------------------------------
# JPA / Hibernate
# ddl-auto=validate: Hibernate must never auto-generate or alter schema in
# this project. Flyway (below) is the only thing that owns schema changes,
# and Flyway itself is Database-Architect-owned (constitution 6).
# ---------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ---------------------------------------------------------------------------
# Flyway
# backend/ and database/ are sibling folders under the repo root - migrations
# live in the Database Architect-owned /database folder, not under /backend.
# ---------------------------------------------------------------------------
spring.flyway.enabled=true
spring.flyway.locations=filesystem:../database/migrations

# ---------------------------------------------------------------------------
# Jackson
# ---------------------------------------------------------------------------
# Jackson 3 (tools.jackson.*, the default in Spring Boot 4) removed
# SerializationFeature.WRITE_DATES_AS_TIMESTAMPS - dates already serialize as
# ISO-8601 strings by default, so the old opt-out property is both invalid and
# unnecessary here.
spring.jackson.time-zone=UTC

# ---------------------------------------------------------------------------
# JWT / refresh token lifetimes (docs/architecture/authentication.md)
# JWT_SECRET has no default - required env var, must be a long, random,
# base64/plain string (32+ bytes) used as the HMAC-SHA signing key. Never
# commit a real value (constitution 13).
# ---------------------------------------------------------------------------
app.security.jwt.secret=${JWT_SECRET}
app.security.jwt.access-token-ttl-seconds=900
app.security.jwt.refresh-token-ttl-days=30

# ---------------------------------------------------------------------------
# Verification tokens (password reset / email verification)
# ---------------------------------------------------------------------------
app.security.verification.password-reset-ttl-minutes=60
app.security.verification.email-verification-ttl-hours=24

# ---------------------------------------------------------------------------
# Account lockout (security-architecture.md section 5)
# ---------------------------------------------------------------------------
app.security.lockout.max-attempts=5
app.security.lockout.duration-minutes=15

# ---------------------------------------------------------------------------
# CORS - closed by default (empty = no cross-origin requests allowed). Only
# relevant to a future browser-based client; the mobile app is unaffected.
# Comma-separated list of exact origins, e.g. https://app.myexpense.example
# ---------------------------------------------------------------------------
app.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# ---------------------------------------------------------------------------
# Rate limiting - /api/v1/auth/** strict tier (security-architecture.md
# section 1/11). "ip" applies to all 8 endpoints; the rest are per-account
# (email) tiers layered on top of the endpoints that carry an email.
# ---------------------------------------------------------------------------
app.ratelimit.auth.ip.capacity=20
app.ratelimit.auth.ip.window-seconds=60
app.ratelimit.auth.login.capacity=5
app.ratelimit.auth.login.window-seconds=900
app.ratelimit.auth.register.capacity=5
app.ratelimit.auth.register.window-seconds=3600
app.ratelimit.auth.forgot-password.capacity=3
app.ratelimit.auth.forgot-password.window-seconds=900
app.ratelimit.auth.resend-verification.capacity=3
app.ratelimit.auth.resend-verification.window-seconds=900

# ---------------------------------------------------------------------------
# Rate limiting - default per-authenticated-user tier (security-architecture.md
# section 11), applied to every /api/v1/** endpoint except /api/v1/auth/**.
# Introduced with Domain 2 (User & Settings); every later domain inherits it.
# The budget is shared across all of a user's endpoints, not per path.
# ---------------------------------------------------------------------------
app.ratelimit.api.user.capacity=120
app.ratelimit.api.user.window-seconds=60

# ---------------------------------------------------------------------------
# Receipts (Domain 4) - docs/decisions/0020-receipt-upload-cloudinary-signed-direct.md
#
# The root folder every receipt public_id sits under. The full shape is
#   {root}/receipts/{userId}/{uuid}
# and ReceiptPublicIdPolicy re-checks it on every transaction write, so a
# receiptPublicId naming another user's folder is a 400 (ADR 0020 section 3).
#
# This is a FOLDER NAME, NOT A SECRET, which is why it carries a default -
# unlike CLOUDINARY_API_SECRET, which when it is introduced must follow
# JWT_SECRET/DB_PASSWORD and have no default at all (security-architecture.md
# section 6). CLOUDINARY_API_KEY is a public identifier that travels to the
# client by design and is also not a secret.
#
# POST /receipts/upload-signature is NOT implemented this phase. When it is, it
# must build its public_id from ReceiptPublicIdPolicy.slotFor(userId) rather
# than its own copy of this format - two copies means a silent mismatch where
# every legitimately uploaded receipt is rejected at claim time.
# ---------------------------------------------------------------------------
app.receipts.public-id-root=${RECEIPT_PUBLIC_ID_ROOT:myexpense}

# ---------------------------------------------------------------------------
# Phone invites (Domain 6 sub-step 1) - docs/decisions/0015-sms-phone-invite.md
#
# FOUR LIMITS IN TWO LAYERS, and all four are required (ADR 0015 section 4 is
# explicit that its two checks are "two genuinely independent checks - do not
# implement only one and consider the requirement satisfied"):
#
#   per-phone-cooldown-hours  DB COUNT(*) over contact_invites.sent_at, across
#                             ALL callers. Protects the RECIPIENT, who consented
#                             to nothing. A per-user cap alone does not stop five
#                             different users each texting one unlucky number.
#   per-user-daily-cap        DB COUNT(*) over contact_invites.created_at for one
#                             inviting user, all trigger paths combined. Bounds
#                             gateway COST and velocity. Counts ATTEMPTS
#                             INCLUDING FAILURES, or a user whose sends all fail
#                             could retry without limit. A per-phone cooldown
#                             alone does not stop one user working through a
#                             large contact list.
#   burst                     Token bucket on POST /contacts/{id}/invite only -
#                             the request-rate control.
#   daily-requests            Token bucket, 24h window, same endpoint - the long
#                             window a continuously-refilling bucket does not
#                             give (5 per 600s alone permits 720/day).
#
# The buckets count REQUESTS, the DB counts SENDS, so they are not redundant: a
# call answering already_linked or cooldown_active writes no row at all and is
# invisible to the caps while still costing a request. daily-requests is set
# well ABOVE per-user-daily-cap on purpose, so the send cap stays the binding
# limit on real sends. NO NEW TABLE and no new dependency: the same RateLimiter
# that already backs app.ratelimit.auth.register (5 per 3600s) expresses both
# windows.
#
# The buckets are applied ONLY to the explicit endpoint. On the implicit paths
# (POST /contacts, POST /groups, POST /groups/{id}/members) a 429 would fail the
# whole request because of an invite, which ADR 0015 section 4 forbids - there
# the two DB limits do the work and a blocked invite simply does not send. All
# three paths still inherit the API-wide default tier above.
#
# Every number here is an operational tuning knob, not a correctness-critical
# constant (the framing security-architecture.md section 5/11 uses for lockout
# parameters). The defaults are ADR 0015 section 4's own recommended orders of
# magnitude.
#
# app-download-link is the SMS body's download link - a configuration value
# (ADR 0015 section 6) and NOT A SECRET, which is why it carries a default,
# unlike JWT_SECRET/DB_PASSWORD. NO REAL SMS IS SENT THIS PHASE: the gateway is
# LoggingSmsInviteGateway, a stub that logs [DEV SMS STUB] and reports success,
# exactly as LoggingEmailService does for email. A real provider is a new
# external dependency needing constitution 21 clearance through the System
# Architect, and its credentials would be secrets under
# security-architecture.md section 6.
# ---------------------------------------------------------------------------
app.invites.per-phone-cooldown-hours=24
app.invites.per-user-daily-cap=20
app.invites.per-user-window-hours=24
app.invites.burst.capacity=5
app.invites.burst.window-seconds=600
app.invites.daily-requests.capacity=60
app.invites.daily-requests.window-seconds=86400
app.invites.app-download-link=${INVITE_APP_DOWNLOAD_LINK:https://myexpense.app/download}

# ---------------------------------------------------------------------------
# Group balance reconciliation (Domain 6 sub-step 2) - docs/decisions/
# 0023-shared-ledger-contract-corrections.md section 2, Backend follow-up 8
#
# After every group write, GroupBalanceService asserts IN THE SAME TRANSACTION
# that (1) every member has exactly one group_member_balances row and (2) the
# group's balances sum to exactly zero. A violation throws and rolls the write
# back, which is the intended outcome: committing a group whose balances do not
# reconcile is strictly worse than failing the request.
#
# BOTH checks are needed because they catch different bugs. Zero-sum alone
# CANNOT catch a missed member while every balance is 0.00 - a sum over fewer
# rows is still zero - and the row-count check cannot catch a lost update once
# V11/V12 move real money.
#
# Defaults to TRUE rather than false (constitution 29 - correctness before
# performance): both are indexed aggregates over one group. The flag exists so
# it can be turned off DELIBERATELY, with a measurement, not so it quietly
# defaults to off in production.
# ---------------------------------------------------------------------------
app.groups.assert-balance-consistency=true

# ---------------------------------------------------------------------------
# Logging - constitution 23: never log passwords/tokens/credentials. Keep
# this at INFO in any shared/production environment; DEBUG is for local use
# only and must not remain enabled in a deployed build.
# ---------------------------------------------------------------------------
logging.level.com.myexpense.backend=INFO
